<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Rig // Local AI Uplink</title>
<style>
  :root{
    --bg: #14181c;
    --panel: #1b2126;
    --panel-2: #21282e;
    --line: #333d44;
    --amber: #e8a33d;
    --amber-dim: #8a672a;
    --text: #d9dee2;
    --text-dim: #7c8791;
    --good: #6fbf73;
    --bad: #d9695f;
    --mono: "SF Mono", "JetBrains Mono", "Consolas", monospace;
    --sans: "Inter", "Segoe UI", system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);}
  .wrap{display:flex;flex-direction:column;height:100vh;max-width:720px;margin:0 auto;}

  header{
    padding:16px 18px 14px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, var(--panel), var(--bg));
  }
  .title-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
  .title{
    font-family:var(--mono);
    font-size:15px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--amber);
  }
  .title span{color:var(--text-dim);}
  .status{
    font-family:var(--mono);
    font-size:11px;
    color:var(--text-dim);
    display:flex;align-items:center;gap:6px;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--text-dim);flex-shrink:0;}
  .dot.online{background:var(--good);box-shadow:0 0 6px var(--good);}
  .dot.offline{background:var(--bad);box-shadow:0 0 6px var(--bad);}

  .config{
    margin-top:12px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .config input{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    font-family:var(--mono);
    font-size:12px;
    padding:8px 10px;
    border-radius:4px;
    outline:none;
  }
  .config input:focus{border-color:var(--amber-dim);}
  .config label{
    display:block;
    font-family:var(--mono);
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--text-dim);
    margin-bottom:4px;
  }
  .config .full{grid-column:1 / -1;}
  .conn-btn{
    grid-column:1/-1;
    background:var(--amber);
    color:#1a1300;
    border:none;
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    padding:9px;
    border-radius:4px;
    cursor:pointer;
    font-weight:600;
  }
  .conn-btn:active{transform:translateY(1px);}

  main{
    flex:1;
    overflow-y:auto;
    padding:16px 18px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .empty{
    margin:auto;
    text-align:center;
    color:var(--text-dim);
    font-family:var(--mono);
    font-size:12px;
    line-height:1.6;
    max-width:340px;
  }
  .empty .glyph{font-size:26px;color:var(--amber-dim);margin-bottom:10px;}

  .msg{max-width:88%;line-height:1.5;font-size:14.5px;white-space:pre-wrap;word-wrap:break-word;}
  .msg.user{
    align-self:flex-end;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:10px 10px 2px 10px;
    padding:10px 13px;
  }
  .msg.ai{
    align-self:flex-start;
    padding:2px 2px;
    border-left:2px solid var(--amber-dim);
    padding-left:12px;
  }
  .msg.sys{
    align-self:center;
    color:var(--text-dim);
    font-family:var(--mono);
    font-size:11px;
    border:1px dashed var(--line);
    padding:6px 10px;
    border-radius:6px;
  }
  .tag{
    font-family:var(--mono);
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--text-dim);
    display:block;
    margin-bottom:3px;
  }

  footer{
    border-top:1px solid var(--line);
    padding:12px 18px 16px;
    background:var(--panel);
  }
  .input-row{display:flex;gap:8px;}
  #prompt{
    flex:1;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    font-family:var(--sans);
    font-size:14.5px;
    padding:11px 13px;
    border-radius:8px;
    outline:none;
    resize:none;
    max-height:120px;
  }
  #prompt:focus{border-color:var(--amber-dim);}
  #send{
    background:var(--amber);
    color:#1a1300;
    border:none;
    width:46px;
    border-radius:8px;
    cursor:pointer;
    font-size:18px;
    flex-shrink:0;
  }
  #send:disabled{background:var(--line);color:var(--text-dim);cursor:default;}

  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="title-row">
      <div class="title">RIG<span>::</span>UPLINK</div>
      <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">not connected</span></div>
    </div>
    <div class="config">
      <div class="full">
        <label>Tailscale IP + Port</label>
        <input id="host" type="text" placeholder="100.x.x.x:1234" autocapitalize="off" autocorrect="off" spellcheck="false">
      </div>
      <div>
        <label>Model ID</label>
        <input id="model" type="text" placeholder="qwen2.5-coder" autocapitalize="off" autocorrect="off" spellcheck="false">
      </div>
      <div>
        <label>API Key (optional)</label>
        <input id="apikey" type="password" placeholder="leave blank if none">
      </div>
      <button class="conn-btn" id="connectBtn">Check connection</button>
    </div>
  </header>

  <main id="chat">
    <div class="empty" id="emptyState">
      <div class="glyph">⌁</div>
      Enter your PC's Tailscale IP and port above, then hit Check connection.<br><br>
      Once online, this talks straight to LM Studio's OpenAI-compatible endpoint over your private Tailscale network — nothing routes through a third party.
    </div>
  </main>

  <footer>
    <div class="input-row">
      <textarea id="prompt" rows="1" placeholder="Ask your local AI..."></textarea>
      <button id="send">↑</button>
    </div>
  </footer>

</div>

<script>
const chat = document.getElementById('chat');
const emptyState = document.getElementById('emptyState');
const hostInput = document.getElementById('host');
const modelInput = document.getElementById('model');
const keyInput = document.getElementById('apikey');
const connectBtn = document.getElementById('connectBtn');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const promptEl = document.getElementById('prompt');
const sendBtn = document.getElementById('send');

let history = [];
let connected = false;

function baseUrl(){
  let h = hostInput.value.trim();
  if(!h) return null;
  if(!h.startsWith('http')) h = 'http://' + h;
  return h.replace(/\/$/, '');
}

function setStatus(state, label){
  statusDot.className = 'dot ' + state;
  statusText.textContent = label;
}

function addMsg(role, text){
  if(emptyState.parentNode) emptyState.remove();
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  if(role !== 'sys'){
    const tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = role === 'user' ? 'you' : 'local ai';
    div.appendChild(tag);
    div.appendChild(document.createTextNode(text));
  } else {
    div.textContent = text;
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

async function checkConnection(){
  const url = baseUrl();
  if(!url){ setStatus('offline','enter host first'); return; }
  setStatus('offline','checking...');
  try{
    const headers = {};
    if(keyInput.value.trim()) headers['Authorization'] = 'Bearer ' + keyInput.value.trim();
    const res = await fetch(url + '/v1/models', { headers });
    if(!res.ok) throw new Error('bad response');
    const data = await res.json();
    connected = true;
    setStatus('online', 'connected');
    addMsg('sys', 'Uplink established. ' + (data.data ? data.data.length + ' model(s) available.' : ''));
  }catch(err){
    connected = false;
    setStatus('offline', 'unreachable');
    addMsg('sys', 'Could not reach ' + url + '. Check that LM Studio server is running, Tailscale is connected on both devices, and CORS is enabled in LM Studio settings.');
  }
}

async function sendPrompt(){
  const text = promptEl.value.trim();
  if(!text) return;
  const url = baseUrl();
  if(!url){ addMsg('sys','Set your Tailscale IP + port first.'); return; }

  addMsg('user', text);
  history.push({role:'user', content:text});
  promptEl.value = '';
  promptEl.style.height = 'auto';
  sendBtn.disabled = true;

  const aiDiv = addMsg('ai', '...');

  try{
    const headers = {'Content-Type':'application/json'};
    if(keyInput.value.trim()) headers['Authorization'] = 'Bearer ' + keyInput.value.trim();
    const res = await fetch(url + '/v1/chat/completions', {
      method:'POST',
      headers,
      body: JSON.stringify({
        model: modelInput.value.trim() || 'local-model',
        messages: history,
        stream:false
      })
    });
    if(!res.ok) throw new Error('request failed: ' + res.status);
    const data = await res.json();
    const reply = data.choices && data.choices[0] && data.choices[0].message
      ? data.choices[0].message.content
      : '(no response content returned)';
    aiDiv.lastChild.textContent = reply;
    history.push({role:'assistant', content:reply});
    setStatus('online','connected');
  }catch(err){
    aiDiv.lastChild.textContent = 'Error reaching your local AI. Confirm the server is running and reachable at ' + url + '.';
    setStatus('offline','unreachable');
  }finally{
    sendBtn.disabled = false;
    chat.scrollTop = chat.scrollHeight;
  }
}

connectBtn.addEventListener('click', checkConnection);
sendBtn.addEventListener('click', sendPrompt);
promptEl.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendPrompt();
  }
});
promptEl.addEventListener('input', ()=>{
  promptEl.style.height = 'auto';
  promptEl.style.height = Math.min(promptEl.scrollHeight, 120) + 'px';
});
</script>
</body>
</html>
